services:

  registry:
    build:
      context: ../scantrack-registry/ScanTrackRegistry
    ports:
      - "5001:8080"

  linkoping:
    build:
      context: .
      dockerfile: ScanTrackNode/Dockerfile
    ports:
      - "5002:8080"
    environment:
      CITY_NAME: Linköping
      NODE_URL: http://linkoping:8080
      REGISTRY_URL: http://registry:8080
    depends_on:
      - registry
    restart: on-failure

  norrkoping:
    build:
      context: .
      dockerfile: ScanTrackNode/Dockerfile
    ports:
      - "5003:8080"
    environment:
      CITY_NAME: Norrköping
      NODE_URL: http://norrkoping:8080
      REGISTRY_URL: http://registry:8080
    depends_on:
      - registry
    restart: on-failure

  stockholm:
    build:
      context: .
      dockerfile: ScanTrackNode/Dockerfile
    ports:
      - "5004:8080"
    environment:
      CITY_NAME: Stockholm
      NODE_URL: http://stockholm:8080
      REGISTRY_URL: http://registry:8080
    depends_on:
      - registry
    restart: on-failure
